name: Bug report
description: Report a reproducible ARES defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, provider tokens, private documents, or unredacted personal data. Security vulnerabilities belong in GitHub private vulnerability reporting, not a public issue."
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened? Include sanitized logs or request IDs when useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands/steps using non-sensitive fixtures.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: ARES revision
      placeholder: commit SHA or release tag
    validations:
      required: true
