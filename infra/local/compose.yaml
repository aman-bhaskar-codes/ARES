services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: ares
      POSTGRES_USER: ares
      POSTGRES_PASSWORD: ares
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ares-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ares -d ares"]
      interval: 5s
      timeout: 3s
      retries: 15

  searxng:
    image: ghcr.io/searxng/searxng:2026.9.25-12f8b6515
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ares-searxng-cache:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8080/
    restart: unless-stopped

volumes:
  ares-postgres:
  ares-searxng-cache:
